[package]
name = "attestation_agent"
version = "0.6.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
wmi = "0.14"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }